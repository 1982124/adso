# Datadog Synthetic tests are intentionally manual until ADSO has the
# Datadog credentials configured in GitHub Actions secrets. This keeps the
# production CI signal trustworthy while preserving the integration.

name: Run Datadog Synthetic tests

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - name: Check Datadog credentials
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
        run: |
          test -n "$DD_API_KEY" || { echo "DD_API_KEY is not configured"; exit 1; }
          test -n "$DD_APP_KEY" || { echo "DD_APP_KEY is not configured"; exit 1; }

      - name: Run Datadog Synthetic tests
        uses: DataDog/synthetics-ci-github-action@7039855343386c30068a97ca381e68ea405e8539 # v4.1.1
        with:
          api_key: ${{ secrets.DD_API_KEY }}
          app_key: ${{ secrets.DD_APP_KEY }}
          test_search_query: 'tag:e2e-tests'
