# Datadog Synthetic tests run automatically when the repository contains
# the required Datadog credentials. Without credentials the job is skipped,
# so observability remains optional without breaking the production CI signal.

name: Run Datadog Synthetic tests

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    env:
      DD_API_KEY: ${{ secrets.DD_API_KEY }}
      DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
    if: ${{ env.DD_API_KEY != '' && env.DD_APP_KEY != '' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - name: Run Datadog Synthetic tests
        uses: DataDog/synthetics-ci-github-action@87b505388a22005bb8013481e3f73a367b9a53eb # v1.4.0
        with:
          api_key: ${{ env.DD_API_KEY }}
          app_key: ${{ env.DD_APP_KEY }}
          test_search_query: 'tag:e2e-tests'
