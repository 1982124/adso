# Datadog Synthetic tests are enabled automatically when the repository
# contains DD_API_KEY and DD_APP_KEY secrets. Keeping the job dormant without
# credentials prevents CI from failing for environments that do not yet use
# Datadog, while preserving the production observability integration.

name: Run Datadog Synthetic tests

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    if: ${{ secrets.DD_API_KEY != '' && secrets.DD_APP_KEY != '' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - name: Run Datadog Synthetic tests
        uses: DataDog/synthetics-ci-github-action@87b505388a22005bb8013481e3f73a367b9a53eb # v1.4.0
        with:
          api_key: ${{ secrets.DD_API_KEY }}
          app_key: ${{ secrets.DD_APP_KEY }}
          test_search_query: 'tag:e2e-tests'
