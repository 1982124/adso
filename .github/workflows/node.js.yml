# ADSO CI — deterministic Bun-based install/build pipeline.

name: ADSO CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"

      - name: Install dependencies from lockfile
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Production build
        run: bun run build
        env:
          DATABASE_URL: file:./ci.db
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: ci-only-not-for-production
          ADSO_OFFICIAL_FEEDS_JSON: "[]"
          ADSO_CRON_SECRET: ci-only-not-for-production
