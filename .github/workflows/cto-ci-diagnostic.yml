name: CTO CI Diagnostic

on:
  push:
    branches: [cto/adso-international-finalization-20260819]

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/adso
      NEXTAUTH_SECRET: ci-only-secret-not-used-in-production
      NEXTAUTH_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        id: install
        continue-on-error: true
        run: npm install --no-audit --no-fund 2>&1 | tee /tmp/npm-install.log

      - name: Prisma validate
        id: prisma_validate
        continue-on-error: true
        run: npx prisma validate 2>&1 | tee /tmp/prisma-validate.log

      - name: Prisma generate
        id: prisma_generate
        continue-on-error: true
        run: npx prisma generate 2>&1 | tee /tmp/prisma-generate.log

      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: npx tsc --noEmit 2>&1 | tee /tmp/typecheck.log

      - name: Lint
        id: lint
        continue-on-error: true
        run: npm run lint 2>&1 | tee /tmp/lint.log

      - name: Production build
        id: build
        continue-on-error: true
        run: npm run build 2>&1 | tee /tmp/build.log

      - name: Collect diagnostics
        if: always()
        run: |
          {
            echo "Node: $(node --version)"
            echo "npm: $(npm --version)"
            echo "npm install: ${{ steps.install.outcome }}"
            echo "prisma validate: ${{ steps.prisma_validate.outcome }}"
            echo "prisma generate: ${{ steps.prisma_generate.outcome }}"
            echo "typecheck: ${{ steps.typecheck.outcome }}"
            echo "lint: ${{ steps.lint.outcome }}"
            echo "build: ${{ steps.build.outcome }}"
          } | tee /tmp/summary.txt

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cto-ci-diagnostic
          path: /tmp/*.log
          if-no-files-found: warn

      - name: Fail if any check failed
        if: always()
        run: |
          test "${{ steps.install.outcome }}" = success && \
          test "${{ steps.prisma_validate.outcome }}" = success && \
          test "${{ steps.prisma_generate.outcome }}" = success && \
          test "${{ steps.typecheck.outcome }}" = success && \
          test "${{ steps.lint.outcome }}" = success && \
          test "${{ steps.build.outcome }}" = success
