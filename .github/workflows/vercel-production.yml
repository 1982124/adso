name: Deploy ADSO to Vercel Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Quality gate and deploy production
    runs-on: ubuntu-latest

    env:
      VERCEL_ORG_ID: team_mx52snHfM2FwA3sXVop7HSNI
      VERCEL_PROJECT_ID: prj_oTc7AzZ3qcT7Ru0tlepAirF2anoh

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Validate production build
        run: npm run build
        env:
          DATABASE_URL: file:./ci.db
          NEXTAUTH_URL: https://adso-ai-driving.vercel.app
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          ADSO_OFFICIAL_FEEDS_JSON: ${{ secrets.ADSO_OFFICIAL_FEEDS_JSON }}
          ADSO_CRON_SECRET: ${{ secrets.ADSO_CRON_SECRET }}

      - name: Pull Vercel production configuration
        run: npx vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Build Vercel production artifact
        run: npx vercel build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Vercel production artifact
        run: npx vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
