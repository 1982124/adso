name: Production Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/adso
      NEXTAUTH_SECRET: ci-only-secret-not-used-in-production-32chars
      NEXTAUTH_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Security audit — block high and critical vulnerabilities
        run: npm audit --audit-level=high

      - name: Prisma validate
        run: npx prisma validate

      - name: Prisma generate
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Dead-link guard
        run: |
          if grep -R --line-number --exclude-dir=node_modules --include='*.tsx' --include='*.ts' 'href="#"' src; then
            echo 'Dead href="#" detected. Every production link must have a real destination.'
            exit 1
          fi

      - name: Production build
        run: npm run build
