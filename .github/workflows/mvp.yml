name: ADSO MVP CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: adso-mvp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/adso_ci
      NEXT_TELEMETRY_DISABLED: 1
      NEXTAUTH_SECRET: ci-only-secret-not-used-in-production-32chars
      NEXTAUTH_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build
