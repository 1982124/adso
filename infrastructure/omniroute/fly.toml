app = "adso-omniroute"
primary_region = "cdg"

[build]
  image = "ghcr.io/ourines/omniroute:latest"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1

[[mounts]]
  source = "omniroute_data"
  destination = "/data"

[[http_service.checks]]
  grace_period = "30s"
  interval = "15s"
  timeout = "5s"
  method = "GET"
  path = "/health"

[env]
  OMNIROUTE_PORT = "8080"
  OMNIROUTE_DATA_DIR = "/data"
