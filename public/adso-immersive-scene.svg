<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Scène ADSO : danger près d'une école</title>
<desc id="desc">Un élève en uniforme kaki près d'une école, un panneau signalant la traversée d'élèves, une moto dont le conducteur ne porte pas de casque et un parent qui alerte en pointant le panneau.</desc>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#8ed0f0"/><stop offset="1" stop-color="#eef9ff"/></linearGradient>
  <linearGradient id="road" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#303a43"/><stop offset="1" stop-color="#111827"/></linearGradient>
  <linearGradient id="school" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5d48a"/><stop offset="1" stop-color="#c58a45"/></linearGradient>
</defs>
<rect width="1200" height="760" fill="url(#sky)"/>
<circle cx="990" cy="105" r="54" fill="#fff5b5" opacity=".9"/>
<rect y="310" width="1200" height="450" fill="#6b9b55"/>
<path d="M0 505 H1200" stroke="#263238" stroke-width="185"/>
<path d="M410 760 L535 310 L665 310 L800 760Z" fill="url(#road)"/>
<g opacity=".95" stroke="#fff" stroke-width="14"><path d="M520 355 l-24 70"/><path d="M480 480 l-25 70"/><path d="M440 605 l-25 70"/><path d="M680 355 l25 70"/><path d="M720 480 l25 70"/><path d="M760 605 l25 70"/></g>
<!-- school -->
<g transform="translate(70 180)"><rect x="0" y="0" width="330" height="175" rx="10" fill="url(#school)" stroke="#7c4a20" stroke-width="6"/><path d="M-20 0 L165 -90 L350 0Z" fill="#9f3d2f" stroke="#6b2b22" stroke-width="6"/><rect x="130" y="85" width="70" height="90" fill="#68442f"/><g fill="#bfe8f7" stroke="#62462f" stroke-width="4"><rect x="30" y="55" width="55" height="48"/><rect x="235" y="55" width="55" height="48"/></g><text x="165" y="42" text-anchor="middle" font-family="Arial" font-size="25" font-weight="900" fill="#fff">ÉCOLE</text></g>
<!-- school crossing sign -->
<g transform="translate(825 125)"><rect x="48" y="92" width="16" height="220" fill="#64748b"/><rect x="0" y="0" width="112" height="112" rx="8" fill="#fff" stroke="#111827" stroke-width="7"/><path d="M12 12 H100 V100 H12Z" fill="#facc15" stroke="#111827" stroke-width="5"/><g fill="#111827"><circle cx="47" cy="35" r="10"/><path d="M40 48 l15 8 l8 25 h-12 l-8-15 l-9 18 h-13 l12-28Z"/><path d="M66 55 l17 7 l10 20 h-12 l-9-12 l-14-6Z"/></g><text x="56" y="137" text-anchor="middle" font-family="Arial" font-size="18" font-weight="900" fill="#fff">TRAVERSÉE</text><text x="56" y="159" text-anchor="middle" font-family="Arial" font-size="18" font-weight="900" fill="#fff">ÉLÈVES</text></g>
<!-- crosswalk -->
<g fill="#fff" opacity=".95"><path d="M250 465h150v18H250z"/><path d="M240 493h150v18H240z"/><path d="M230 521h150v18H230z"/><path d="M220 549h150v18H220z"/></g>
<!-- student -->
<g transform="translate(355 420)"><circle cx="42" cy="-25" r="25" fill="#6b3f2a"/><path d="M18 -40 Q42 -70 66 -40" fill="#111827"/><path d="M10 8 Q42 -5 74 8 L84 105 H0Z" fill="#a78b58" stroke="#5b4a2e" stroke-width="5"/><path d="M20 35 H64 M20 55 H64" stroke="#d7c48b" stroke-width="5"/><path d="M18 103 L8 155 M65 103 L76 155" stroke="#263238" stroke-width="15" stroke-linecap="round"/><path d="M5 154 H-8 M75 154 H88" stroke="#111827" stroke-width="10" stroke-linecap="round"/><text x="42" y="195" text-anchor="middle" font-family="Arial" font-size="18" font-weight="900" fill="#fff">ÉLÈVE</text></g>
<!-- motorcycle and rider without helmet -->
<g transform="translate(620 485)"><circle cx="30" cy="92" r="30" fill="#111827"/><circle cx="150" cy="92" r="30" fill="#111827"/><path d="M30 92 L70 25 L115 92 M70 25 L115 20 L150 92 M70 25 L48 10" fill="none" stroke="#f59e0b" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/><path d="M78 38 Q100 4 125 30" fill="#ef4444" stroke="#7f1d1d" stroke-width="5"/><circle cx="83" cy="-18" r="25" fill="#8b5137"/><path d="M60 -35 Q84 -62 108 -35" fill="#111827"/><path d="M68 -4 L53 42 L95 70" fill="none" stroke="#2563eb" stroke-width="16" stroke-linecap="round"/><text x="92" y="142" text-anchor="middle" font-family="Arial" font-size="17" font-weight="900" fill="#fff">SANS CASQUE</text></g>
<!-- parent pointing at sign -->
<g transform="translate(970 420)"><circle cx="55" cy="-15" r="28" fill="#7a4930"/><path d="M28 -35 Q55 -68 82 -35" fill="#111827"/><path d="M15 20 Q55 2 95 20 L112 145 H0Z" fill="#2563eb"/><path d="M28 48 L-55 -5" stroke="#7a4930" stroke-width="16" stroke-linecap="round"/><path d="M-55 -5 L-82 -30" stroke="#7a4930" stroke-width="12" stroke-linecap="round"/><path d="M-82 -30 L-98 -32" stroke="#7a4930" stroke-width="9" stroke-linecap="round"/><path d="M90 48 L120 95" stroke="#7a4930" stroke-width="15" stroke-linecap="round"/><text x="55" y="180" text-anchor="middle" font-family="Arial" font-size="18" font-weight="900" fill="#fff">PARENT · ALERTE</text></g>
<!-- pedagogical overlay -->
<g transform="translate(45 40)"><rect width="420" height="120" rx="24" fill="#06121d" opacity=".9" stroke="#34d399" stroke-width="2"/><text x="24" y="43" font-family="Arial" font-size="25" font-weight="900" fill="#6ee7b7">LE DANGER ÉTAIT SIGNALÉ.</text><text x="24" y="77" font-family="Arial" font-size="18" fill="#fff">Savoir lire la route, c'est aussi</text><text x="24" y="103" font-family="Arial" font-size="18" fill="#fff">savoir protéger une vie.</text></g>
</svg>