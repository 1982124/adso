<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">ADSO — accident pédagogique devant une école</title>
<desc id="desc">Scène pédagogique africaine : devant une école, un taxi-moto a renversé un élève qui est au sol près du passage piéton. Une autre personne alerte et un panneau signale la présence d'élèves.</desc>
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#83c9f5"/><stop offset="1" stop-color="#eef8ff"/></linearGradient>
<linearGradient id="road" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3e464c"/><stop offset="1" stop-color="#171a1d"/></linearGradient>
<filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-opacity=".25"/></filter>
</defs>
<rect width="1600" height="900" fill="url(#sky)"/>
<circle cx="1390" cy="115" r="70" fill="#fff2a8" opacity=".9"/>
<path d="M0 425 Q250 340 480 425 T960 425 T1440 410 T1600 420 V540 H0Z" fill="#76aa61"/>
<rect y="520" width="1600" height="380" fill="url(#road)"/>
<path d="M0 700 H1600" stroke="#f7f7f7" stroke-width="14" stroke-dasharray="85 60" opacity=".8"/>
<g filter="url(#shadow)">
<rect x="80" y="235" width="530" height="300" rx="18" fill="#f5eee1"/>
<path d="M55 260 L345 70 L635 260Z" fill="#1d6652"/>
<rect x="290" y="370" width="120" height="165" rx="8" fill="#70452f"/>
<rect x="125" y="335" width="115" height="90" rx="10" fill="#9dd8f1"/>
<rect x="455" y="335" width="115" height="90" rx="10" fill="#9dd8f1"/>
<rect x="150" y="180" width="390" height="76" rx="12" fill="#fff"/>
<text x="345" y="232" text-anchor="middle" font-family="Arial,sans-serif" font-size="40" font-weight="900" fill="#173f35">ÉCOLE</text>
</g>
<g filter="url(#shadow)">
<rect x="655" y="365" width="100" height="155" rx="10" fill="#fff"/>
<path d="M705 360 L650 280 H760Z" fill="#d62828"/>
<text x="705" y="348" text-anchor="middle" font-family="Arial,sans-serif" font-size="58" font-weight="900" fill="#d62828">!</text>
<text x="705" y="410" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="900" fill="#222">ÉLÈVES</text>
<path d="M670 475 H740" stroke="#777" stroke-width="12"/>
</g>
<!-- taxi-moto renversé -->
<g transform="translate(930 525) rotate(-10)" filter="url(#shadow)">
<circle cx="-105" cy="120" r="50" fill="#11161a"/><circle cx="175" cy="120" r="50" fill="#11161a"/>
<circle cx="-105" cy="120" r="21" fill="#c5ccd2"/><circle cx="175" cy="120" r="21" fill="#c5ccd2"/>
<path d="M-70 95 L0 35 L90 65 L145 105 L75 108 L35 70 L0 110Z" fill="#e2ad36"/>
<path d="M0 35 L75 35 L105 65 L55 65Z" fill="#f1f4f5"/>
<circle cx="35" cy="5" r="25" fill="#8d5524"/><path d="M10 5 Q35 -28 62 5" fill="#101010"/>
<path d="M0 35 Q35 15 70 35 L76 80 L-5 80Z" fill="#0f766e"/>
<text x="35" y="180" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="900" fill="#fff">TAXI-MOTO</text>
</g>
<!-- élève renversé au sol -->
<g transform="translate(760 700)" filter="url(#shadow)">
<circle cx="-10" cy="-105" r="29" fill="#8d5524"/>
<path d="M-39 -105 Q-10 -142 20 -106" fill="#111"/>
<path d="M-78 -65 Q-10 -120 58 -65 L115 0 L75 40 L15 -12 L-35 70 L-90 45Z" fill="#2563eb"/>
<path d="M35 30 L120 62" stroke="#1f2937" stroke-width="28" stroke-linecap="round"/>
<path d="M-5 30 L-95 75" stroke="#1f2937" stroke-width="28" stroke-linecap="round"/>
<path d="M-55 -48 L-145 -5" stroke="#8d5524" stroke-width="20" stroke-linecap="round"/>
<path d="M-60 -40 L-150 -15" stroke="#8d5524" stroke-width="20" stroke-linecap="round"/>
<rect x="-50" y="-65" width="100" height="42" rx="10" fill="#fff" opacity=".92"/>
<text x="0" y="-37" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="900" fill="#173f35">ÉLÈVE</text>
</g>
<!-- adulte qui alerte -->
<g transform="translate(1160 590)" filter="url(#shadow)">
<circle cx="0" cy="0" r="28" fill="#8d5524"/><path d="M-28 0 Q0 -38 28 0" fill="#111"/>
<path d="M-48 38 Q0 8 48 38 L58 150 H-58Z" fill="#f59e0b"/>
<path d="M-30 65 L-105 10" stroke="#8d5524" stroke-width="20" stroke-linecap="round"/>
<path d="M30 65 L105 10" stroke="#8d5524" stroke-width="20" stroke-linecap="round"/>
<text x="0" y="195" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="900" fill="#fff">ATTENTION AUX ÉLÈVES</text>
</g>
<!-- passage piéton -->
<g opacity=".95">
<path d="M560 650 H1040" stroke="#fff" stroke-width="18"/>
<path d="M560 695 H1040" stroke="#fff" stroke-width="18"/>
<path d="M560 740 H1040" stroke="#fff" stroke-width="18"/>
<path d="M560 785 H1040" stroke="#fff" stroke-width="18"/>
</g>
<rect x="42" y="40" width="430" height="64" rx="32" fill="#0b3b32" opacity=".95"/>
<text x="257" y="82" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="900" fill="#fff">ADSO · SCÈNE PÉDAGOGIQUE</text>
<rect x="1030" y="790" width="500" height="70" rx="35" fill="#000" opacity=".55"/>
<text x="1280" y="835" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="800" fill="#fff">UN ACCIDENT PEUT ARRIVER EN QUELQUES SECONDES</text>
</svg>
