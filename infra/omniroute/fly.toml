app = "adso-omniroute-gateway"
primary_region = "jnb"

# Pin production to a known OmniRoute release. Upgrade deliberately after smoke tests.
[build]
  image = "diegosouzapw/omniroute:3.8.40"

[env]
  HOST = "0.0.0.0"
  BIND = "0.0.0.0"
  PORT = "20128"
  DATA_DIR = "/data"
  NODE_ENV = "production"

# Persistent OmniRoute state: credentials, provider configuration, endpoint keys
# and SQLite data must survive machine restarts/redeploys.
[[mounts]]
  source = "omniroute_data"
  destination = "/data"
  initial_size = "20gb"
  snapshot_retention = 14

[http_service]
  internal_port = 20128
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "10s"
    grace_period = "45s"
    method = "GET"
    path = "/api/monitoring/health"

[[vm]]
  memory = "1024mb"
  cpu_kind = "shared"
  cpus = 1

# Keep one always-on machine for the MVP. Do not scale to zero: ADSO requires
# a stable gateway endpoint and persistent SQLite state.
