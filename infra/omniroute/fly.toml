app = "adso-omniroute-gateway"
primary_region = "jnb"

# Pin production to a known stable OmniRoute release.
# Upgrade deliberately after smoke tests; do not use :latest in production.
[build]
  image = "diegosouzapw/omniroute:3.8.50"

[env]
  HOST = "0.0.0.0"
  BIND = "0.0.0.0"
  PORT = "20128"
  DATA_DIR = "/data"
  NODE_ENV = "production"
  NEXT_PUBLIC_BASE_URL = "https://adso-omniroute-gateway.fly.dev"
  APP_LOG_TO_FILE = "true"
  DISABLE_SQLITE_AUTO_BACKUP = "false"
  AUTH_COOKIE_SECURE = "true"
  OMNIROUTE_MEMORY_MB = "768"

# Persistent OmniRoute state: provider configuration, endpoint keys,
# settings, SQLite database, usage and logs survive redeploy/restart.
[[mounts]]
  source = "omniroute_data"
  destination = "/data"
  initial_size = "20gb"
  snapshot_retention = 14

[http_service]
  internal_port = 20128
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "10s"
    grace_period = "45s"
    method = "GET"
    path = "/api/monitoring/health"

[[vm]]
  memory = "1024mb"
  cpu_kind = "shared"
  cpus = 1

# MVP policy: one always-on Machine. Scale horizontally only after
# production telemetry demonstrates the need.
