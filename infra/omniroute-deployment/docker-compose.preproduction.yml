# OmniRoute v3.8.52 — préproduction isolée uniquement.
# Aucun port applicatif ni Redis n'est publié sur l'hôte.
# Seul Caddy expose HTTP/HTTPS ; ADSO production reste indépendant.

services:
  redis:
    image: docker.io/library/redis:8.6.5-alpine
    container_name: adso-omniroute-preprod-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redis-data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - omniroute-backend

  omniroute:
    image: diegosouzapw/omniroute:${OMNIROUTE_IMAGE_TAG:?Set OMNIROUTE_IMAGE_TAG to 3.8.52}
    container_name: adso-omniroute-preprod
    restart: unless-stopped
    init: true
    stop_grace_period: 40s
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      REDIS_URL: redis://redis:6379
      NEXT_PUBLIC_BASE_URL: https://${OMNIROUTE_DOMAIN:?Set OMNIROUTE_DOMAIN}
      BASE_URL: http://omniroute:20128
      REQUIRE_API_KEY: "true"
      AUTH_COOKIE_SECURE: "true"
      ALLOW_API_KEY_REVEAL: "false"
      CORS_ALLOWED_ORIGINS: https://${OMNIROUTE_DOMAIN:?Set OMNIROUTE_DOMAIN}
    volumes:
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "healthcheck.mjs"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - omniroute-proxy
      - omniroute-backend
    # Pas de ports publiés : Caddy est le seul accès réseau entrant.

  caddy:
    image: caddy:2.10.2-alpine
    container_name: adso-omniroute-preprod-caddy
    restart: unless-stopped
    init: true
    depends_on:
      omniroute:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    command:
      - caddy
      - reverse-proxy
      - --from
      - https://${OMNIROUTE_DOMAIN:?Set OMNIROUTE_DOMAIN}
      - --to
      - http://omniroute:20128
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    security_opt:
      - no-new-privileges:true
    networks:
      - omniroute-proxy

networks:
  # Frontal : uniquement Caddy et OmniRoute.
  omniroute-proxy:
    driver: bridge
  # Réseau privé sans passerelle externe : OmniRoute et Redis seulement.
  omniroute-backend:
    driver: bridge
    internal: true

volumes:
  redis-data:
  caddy-data:
  caddy-config:
